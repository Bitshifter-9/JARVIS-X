[project]
name = "jarvis-x"
version = "0.1.0"
description = "JARVIS X — autonomous personal operations platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    # data
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # security
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "pyjwt>=2.10",
    # observability
    "structlog>=24.4",
    # Cloud-side browser automation. This is what keeps verified execution alive when
    # the Mac is offline (PLAN.md §3).
    "playwright>=1.48",
    "litellm>=1.98",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.2",
    "fastembed>=0.8",
    "google-auth>=2.57",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.199",
    # The Mac helper dials out over WebSocket; no inbound port is ever opened.
    "websockets>=13.0",
    # YouTube pipeline: free neural TTS (word timings ride along with the audio,
    # so captions need no Whisper) and keyless web research.
    "edge-tts>=7.0",
    "ddgs>=9.0",
]

[project.optional-dependencies]
# Voice-cloned avatar mode: F5-TTS speaks the script in the user's voice, and
# faster-whisper recovers word timings for captions (edge-tts gives those for free,
# a cloned voice does not).
# Local image generation for video imagery: SDXL + SDXL-Lightning on the GPU.
# The free hosted tiers cap near 576px, which upscales into soft, blocky frames.
images = [
    "diffusers>=0.31",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "peft>=0.13",          # diffusers needs it to load the Lightning LoRA
    "torch<2.9",
]
avatar = [
    "f5-tts>=1.0",
    "faster-whisper>=1.0",
    # torchaudio >=2.9 decodes only through torchcodec, which dlopens ffmpeg 4-7
    # shared libraries that a Homebrew ffmpeg 9 does not provide. 2.8 still ships
    # the self-contained soundfile backend.
    "torch<2.9",
    "torchaudio<2.9",
    "soundfile>=0.12",
]
# "Hey Jarvis" on the Mac (apps/mac-node, `python -m macnode voice`): a wake-word model
# that listens for one phrase, and Whisper on-device so audio never leaves the machine.
# openWakeWord itself is installed separately (`uv pip install openwakeword`): its
# Linux dependency (tflite-runtime) has no Python 3.12 wheel, and a universal lock
# cannot carry it. The voice command says so if it is missing.
voice = [
    "sounddevice>=0.5",
    "numpy>=1.26",
    "faster-whisper>=1.0",
]
# Hand gestures on the Mac (PLAN.md 10.8): MediaPipe Hands over the webcam, on-device.
gestures = [
    "mediapipe>=0.10",
    "opencv-python>=4.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "hypothesis>=6.166",
    "schemathesis>=4.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/jarvis", "apps/mac-node/macnode"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session. The async engine and its connection pool are
# bound to the loop that created them; a per-test loop would strand every pooled
# connection the moment the first test finished.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "e2e: end-to-end, needs a real browser binary",
    "eval: accuracy evaluation against fixtures",
    "live: needs real provider API keys and spends quota",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]           # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]  # literal paths in fixtures are test data, not file use
