[project]
name = "jarvis-x"
version = "0.1.0"
description = "JARVIS X — autonomous personal operations platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    # data
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # security
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "pyjwt>=2.10",
    # observability
    "structlog>=24.4",
    # Cloud-side browser automation. This is what keeps verified execution alive when
    # the Mac is offline (PLAN.md §3).
    "playwright>=1.48",
    "litellm>=1.98",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.2",
    # The Mac helper dials out over WebSocket; no inbound port is ever opened.
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "hypothesis>=6.166",
    "schemathesis>=4.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/jarvis", "apps/mac-node/macnode"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session. The async engine and its connection pool are
# bound to the loop that created them; a per-test loop would strand every pooled
# connection the moment the first test finished.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "e2e: end-to-end, needs a real browser binary",
    "eval: accuracy evaluation against fixtures",
    "live: needs real provider API keys and spends quota",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]           # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]  # literal paths in fixtures are test data, not file use
