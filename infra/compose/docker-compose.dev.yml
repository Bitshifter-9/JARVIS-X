# Local development stack: Postgres 16 + pgvector.
# The API runs on the host (uv run uvicorn ...) so it can reach Ollama on 127.0.0.1.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jarvis-postgres
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      # 5433 on the host: a Homebrew PostgreSQL commonly owns 5432, and silently
      # connecting to the wrong server is a confusing failure to debug.
      - "5433:5432"
    volumes:
      - jarvis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jarvis-pgdata:
