name: jarvis_x
description: JARVIS X control surface — approvals, deadlines and evidence.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  # Voice: device speech-to-text and text-to-speech — free, on-device, both platforms.
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  url_launcher: ^6.3.0
  file_selector: ^1.1.0
  window_manager: ^0.5.2
  pointycastle: ^4.0.0
  web_socket_channel: ^3.0.3
  android_intent_plus: ^6.1.0
  audioplayers: ^6.8.1
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  flutter_foreground_task: ^11.0.2
  gpt_markdown: ^1.2.1
  image_picker: ^1.2.3
  crypto: ^3.0.7
  shared_preferences: ^2.5.5
  geolocator: ^14.0.2
  vibration: ^3.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

# `dart run flutter_launcher_icons` regenerates every platform icon from assets/icon.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  adaptive_icon_background: "#0f1628"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
